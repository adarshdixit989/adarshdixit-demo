name: BankEase CI
on:
  push:
    paths: ["BankEase/**"]
  pull_request:
    paths: ["BankEase/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BankEase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test
