services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bankease
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: ["bankease_mysql:/var/lib/mysql"]
  app:
    build: .
    depends_on: [mysql]
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bankease?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: change-this-local-secret-to-a-long-random-value-123456
volumes:
  bankease_mysql: