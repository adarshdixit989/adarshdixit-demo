spring.application.name=BankEase
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:mem:bankease;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-a-long-random-value-123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true