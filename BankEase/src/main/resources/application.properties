spring.application.name=BankEase
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bankease?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-a-long-random-value-123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true